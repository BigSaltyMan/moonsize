name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format, check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the release used for the project's local checks and formatting.
      - uses: ./.github/actions/setup-moonbit
      # The CLI scripts use V8 to validate Wasm GC, reference and tail-call fixtures.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Toolchain versions
        run: |
          moon version --all
          node --version
      - name: Formatting
        run: moon fmt --check
      - name: Embedded chart resource matches pinned vendored source
        run: node scripts/embed-echarts.mjs --check
      - name: Vendored compression integrity
        run: node scripts/check-vendored-compression.mjs
      # Warnings are errors here, because the library is meant to build clean on
      # a toolchain that keeps finding new things to warn about.
      - name: Check
        run: moon check --target native --deny-warn
      - name: Test
        run: moon test
      - name: Build native CLI
        run: moon build --target native --release
      - name: Function-diff-JSON CLI regressions (four cases)
        run: node scripts/test-function-diff-json.mjs _build/native/release/build/cmd/main/main.exe
      - name: Summary-JSON CLI regressions (four cases)
        run: node scripts/test-summary-json.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-instructions-diff CLI regressions (four cases)
        run: node scripts/test-function-instructions-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-search CLI regressions (four cases)
        run: node scripts/test-function-search.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-instructions CLI regressions (four cases)
        run: node scripts/test-function-instructions.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-duplicates CLI regressions (four cases)
        run: node scripts/test-data-duplicates.mjs _build/native/release/build/cmd/main/main.exe
      - name: Imports-diff CLI regressions (four cases)
        run: node scripts/test-imports-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Imports CLI regressions (four cases)
        run: node scripts/test-imports.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-preview-diff CLI regressions (four cases)
        run: node scripts/test-data-preview-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-hex-search CLI regressions (four cases)
        run: node scripts/test-data-hex-search.mjs _build/native/release/build/cmd/main/main.exe
      - name: Opcode-search CLI regressions (four cases)
        run: node scripts/test-opcode-search.mjs _build/native/release/build/cmd/main/main.exe
      - name: Module-opcode-diff CLI regressions (four cases)
        run: node scripts/test-module-opcode-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Module-opcode CLI regressions (four cases)
        run: node scripts/test-module-opcodes.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-local-accesses CLI regressions (four cases)
        run: node scripts/test-function-local-accesses.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-locals-diff CLI regressions (four cases)
        run: node scripts/test-function-locals-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-locals CLI regressions (four cases)
        run: node scripts/test-function-locals.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-calls CLI regressions (four cases)
        run: node scripts/test-function-calls.mjs _build/native/release/build/cmd/main/main.exe
      - name: File-offset-decode CLI regressions (four cases)
        run: node scripts/test-file-offset-decode.mjs _build/native/release/build/cmd/main/main.exe
      - name: File-range CLI regressions (four cases)
        run: node scripts/test-file-range.mjs _build/native/release/build/cmd/main/main.exe
      - name: File-offset CLI regressions (four cases)
        run: node scripts/test-file-offset.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-preview CLI regressions (four cases)
        run: node scripts/test-data-preview.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-search CLI regressions (four cases)
        run: node scripts/test-data-search.mjs _build/native/release/build/cmd/main/main.exe
      - name: CLI option-boundary regressions (four cases)
        run: node scripts/test-cli-option-boundary.mjs _build/native/release/build/cmd/main/main.exe
      - name: Help-topic CLI regressions (four cases, no Wasm input)
        run: node scripts/test-help-topics.mjs _build/native/release/build/cmd/main/main.exe
      - name: Exports-diff CLI regressions (four cases)
        run: node scripts/test-exports-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Exports CLI regressions (four cases)
        run: node scripts/test-exports.mjs _build/native/release/build/cmd/main/main.exe
      - name: Metadata-diff CLI regressions (four cases)
        run: node scripts/test-metadata-diff.mjs _build/native/release/build/cmd/main/main.exe
      - name: Metadata CLI regressions (four cases)
        run: node scripts/test-metadata.mjs _build/native/release/build/cmd/main/main.exe
      - name: Duplicate-function CLI regressions (four cases)
        run: node scripts/test-duplicate-functions.mjs _build/native/release/build/cmd/main/main.exe
      - name: Entrypoint CLI regressions (four cases)
        run: node scripts/test-entrypoints.mjs _build/native/release/build/cmd/main/main.exe
      - name: Generic-instance CLI regressions (one real probe, four cases)
        run: node scripts/test-generic-instances.mjs _build/native/release/build/cmd/main/main.exe
      - name: Prepare Graphviz consumer (Linux test dependency only)
        run: |
          if ! command -v dot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi
          command -v dot
          dot -V
      - name: Dependencies-DOT CLI and Graphviz consumer (four cases)
        id: dependencies-dot
        run: node scripts/test-dependencies-dot.mjs _build/native/release/build/cmd/main/main.exe --require-graphviz
      - name: Save this run's dependencies DOT consumer evidence
        if: always() && steps.dependencies-dot.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-dot-consumer-${{ github.sha }}
          path: ${{ steps.dependencies-dot.outputs.evidence_dir }}
          if-no-files-found: error
      - name: Dependents-DOT CLI and Graphviz consumer (four cases)
        id: dependents-dot
        run: node scripts/test-dependents-dot.mjs _build/native/release/build/cmd/main/main.exe --require-graphviz
      - name: Save this run's dependents DOT consumer evidence
        if: always() && steps.dependents-dot.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependents-dot-consumer-${{ github.sha }}
          path: ${{ steps.dependents-dot.outputs.evidence_dir }}
          if-no-files-found: error
      - name: Dependency-overlap CLI regressions (four cases)
        run: node scripts/test-dependency-overlap.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-path-between CLI regressions (four cases)
        run: node scripts/test-function-path-between.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-dependents CLI regressions (four cases)
        run: node scripts/test-function-dependents.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-dependencies CLI regressions (four cases)
        run: node scripts/test-function-dependencies.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-cycle-witness CLI regressions (four cases)
        run: node scripts/test-function-cycle-witness.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-cycles CLI regressions (four cases)
        run: node scripts/test-function-cycles.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-callers CLI regressions
        run: node scripts/test-function-callers.mjs _build/native/release/build/cmd/main/main.exe
      - name: Data-segment encoding CLI regressions
        run: node scripts/test-data-segments.mjs _build/native/release/build/cmd/main/main.exe
      - name: Small large-module benchmark smoke (no timing gate)
        run: node scripts/bench-large-modules.mjs _build/native/release/build/cmd/main/main.exe --smoke --cli-source-sha "$GITHUB_SHA"
      - name: Large-module smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-module-benchmark-smoke
          path: _build/large-module-benchmark/
          if-no-files-found: warn
      - name: Report output protection and exclusive-create regressions
        run: node scripts/test-output-protection.mjs _build/native/release/build/cmd/main/main.exe
      - name: Tail-call CLI regressions
        run: bash scripts/test-tail-calls.sh _build/native/release/build/cmd/main/main.exe
      - name: Graph-diagnostic CLI regressions
        run: bash scripts/test-graph-diagnostics.sh _build/native/release/build/cmd/main/main.exe
      - name: Parser-boundary CLI regressions
        run: bash scripts/test-parser-boundaries.sh _build/native/release/build/cmd/main/main.exe
      - name: Module-structure CLI regressions
        run: bash scripts/test-module-structure.sh _build/native/release/build/cmd/main/main.exe
      - name: Size-comparison CLI regressions
        run: bash scripts/test-size-comparison.sh _build/native/release/build/cmd/main/main.exe
      - name: Compression-report CLI regressions
        run: bash scripts/test-compression-report.sh _build/native/release/build/cmd/main/main.exe
      - name: HTML report data, fallback and formatter regressions
        run: node scripts/test-html-report.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-diff CLI regressions
        run: bash scripts/test-function-diff.sh _build/native/release/build/cmd/main/main.exe
      - name: Optimization-experiment CLI regressions
        run: node scripts/test-optimization-experiment.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-path CLI regressions
        run: node scripts/test-function-path.mjs _build/native/release/build/cmd/main/main.exe
      - name: Multi-metric budget CLI regressions
        run: node scripts/test-budget.mjs _build/native/release/build/cmd/main/main.exe
      - name: HTML delivery test dependencies (not CLI dependencies)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Relocated offline report and real A4 PDF regressions
        run: |
          mkdir -p _build/html-delivery-verification
          npm run dev > _build/html-delivery-verification/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-html-portability.mjs _build/native/release/build/cmd/main/main.exe --browser
      - name: HTML offline and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-delivery-evidence
          path: _build/html-delivery-verification/
          if-no-files-found: error
      - name: MoonBit budget source demo and rollback
        run: node scripts/demo-budget.mjs _build/native/release/build/cmd/main/main.exe
      - name: Budget source evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budget-source-evidence
          path: |
            _build/budget-demo/*.json
            _build/budget-demo/*.md
            _build/budget-demo/*.txt
            _build/budget-demo/*.wasm
            _build/budget-demo/run.log
          if-no-files-found: error
      - name: MoonBit function-path source demo and rollback
        run: node scripts/demo-function-path.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-path evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: function-path-evidence
          path: |
            _build/function-path-demo/*.json
            _build/function-path-demo/*.html
            _build/function-path-demo/*.txt
            _build/function-path-demo/run.log
            _build/function-path-demo/*.wasm
          if-no-files-found: error
      - name: MoonBit function-diff source demo and rollback
        run: bash scripts/demo-function-diff.sh _build/native/release/build/cmd/main/main.exe
      - name: Retained model versus rebuilt size evidence
        run: node scripts/demo-retained-boundaries.mjs _build/native/release/build/cmd/main/main.exe
      - name: Retained boundary evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retained-boundary-evidence
          path: |
            _build/retained-boundaries/results.json
            _build/retained-boundaries/*/*.wasm
            _build/retained-boundaries/*/*.wasm.report.txt
            _build/retained-boundaries/*/*.wasm.graph.json
            _build/retained-boundaries/*/*.wasm.comparison.txt
            _build/retained-boundaries/*/*.stdout.txt
            _build/retained-boundaries/*/experiment*.json
            _build/retained-boundaries/*/experiment.html
          if-no-files-found: error

  size-budget:
    name: Size budget
    runs-on: ubuntu-latest
    env:
      # Keep the default debug build and its artifact path in sync.
      EXAMPLE: _build/wasm/debug/build/examples/examples.wasm
      CLI: _build/native/release/build/cmd/main/main.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Toolchain version
        run: moon version --all
      - name: The example still builds
        run: moon build --target wasm
      - name: Inspect the built example
        run: |
          if [[ ! -s "$EXAMPLE" ]]; then
            echo "missing or empty built example: $EXAMPLE" >&2
            exit 1
          fi
          printf 'budget input: %s\nbytes: %s\n' "$EXAMPLE" "$(wc -c < "$EXAMPLE")"
          sha256sum "$EXAMPLE"
      - name: Build native CLI
        run: moon build --target native --release
      - name: The example stays inside its budget
        run: '"$CLI" "$EXAMPLE" --max-size 100KB'
      - name: Multi-metric budget for the freshly built example
        run: |
          "$CLI" "$EXAMPLE" --budget examples/ci-budget.json \
            --budget-json _build/ci-budget-result.json \
            --budget-md _build/ci-budget-summary.md
          cat _build/ci-budget-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save actual example budget evidence
        uses: actions/upload-artifact@v4
        with:
          name: size-budget-evidence
          path: |
            _build/ci-budget-result.json
            _build/ci-budget-summary.md
          if-no-files-found: error
      # Every valid module exceeds 0B. Only a budget refusal (3), accompanied
      # by its reason, proves that the gate fired; input/launch errors do not.
      - name: The gate actually fires
        run: |
          status=0
          "$CLI" "$EXAMPLE" --max-size 0B > gate.log 2>&1 || status=$?
          cat gate.log
          if [[ "$status" -ne 3 ]]; then
            echo "expected budget exit code 3, got $status" >&2
            exit 1
          fi
          grep -Fq "over the budget" gate.log

  current-toolchain-docs:
    name: Current toolchain and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record current toolchain
        run: moon version --all
      - name: Check without legacy registry dependencies
        run: moon check --target native
      - name: Compression regression on current toolchain
        run: moon test --target native compress_wbtest.mbt
      - name: Generate public documentation
        run: moon doc
