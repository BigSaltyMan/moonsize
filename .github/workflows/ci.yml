name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format, check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the release used for the project's local checks and formatting.
      - uses: ./.github/actions/setup-moonbit
      # The CLI scripts use V8 to validate Wasm GC, reference and tail-call fixtures.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Toolchain versions
        run: |
          moon version --all
          node --version
      - name: Formatting
        run: moon fmt --check
      # Warnings are errors here, because the library is meant to build clean on
      # a toolchain that keeps finding new things to warn about.
      - name: Check
        run: moon check --target native --deny-warn
      - name: Test
        run: moon test
      - name: Build native CLI
        run: moon build --target native --release
      - name: Tail-call CLI regressions
        run: bash scripts/test-tail-calls.sh _build/native/release/build/cmd/main/main.exe
      - name: Graph-diagnostic CLI regressions
        run: bash scripts/test-graph-diagnostics.sh _build/native/release/build/cmd/main/main.exe
      - name: Parser-boundary CLI regressions
        run: bash scripts/test-parser-boundaries.sh _build/native/release/build/cmd/main/main.exe
      - name: Module-structure CLI regressions
        run: bash scripts/test-module-structure.sh _build/native/release/build/cmd/main/main.exe
      - name: Size-comparison CLI regressions
        run: bash scripts/test-size-comparison.sh _build/native/release/build/cmd/main/main.exe
      - name: Compression-report CLI regressions
        run: bash scripts/test-compression-report.sh _build/native/release/build/cmd/main/main.exe
      - name: Function-diff CLI regressions
        run: bash scripts/test-function-diff.sh _build/native/release/build/cmd/main/main.exe
      - name: Optimization-experiment CLI regressions
        run: node scripts/test-optimization-experiment.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-path CLI regressions
        run: node scripts/test-function-path.mjs _build/native/release/build/cmd/main/main.exe
      - name: Multi-metric budget CLI regressions
        run: node scripts/test-budget.mjs _build/native/release/build/cmd/main/main.exe
      - name: MoonBit budget source demo and rollback
        run: node scripts/demo-budget.mjs _build/native/release/build/cmd/main/main.exe
      - name: Budget source evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: budget-source-evidence
          path: |
            _build/budget-demo/*.json
            _build/budget-demo/*.md
            _build/budget-demo/*.txt
            _build/budget-demo/*.wasm
            _build/budget-demo/run.log
          if-no-files-found: error
      - name: MoonBit function-path source demo and rollback
        run: node scripts/demo-function-path.mjs _build/native/release/build/cmd/main/main.exe
      - name: Function-path evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: function-path-evidence
          path: |
            _build/function-path-demo/*.json
            _build/function-path-demo/*.html
            _build/function-path-demo/*.txt
            _build/function-path-demo/run.log
            _build/function-path-demo/*.wasm
          if-no-files-found: error
      - name: MoonBit function-diff source demo and rollback
        run: bash scripts/demo-function-diff.sh _build/native/release/build/cmd/main/main.exe
      - name: Retained model versus rebuilt size evidence
        run: node scripts/demo-retained-boundaries.mjs _build/native/release/build/cmd/main/main.exe
      - name: Retained boundary evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retained-boundary-evidence
          path: |
            _build/retained-boundaries/results.json
            _build/retained-boundaries/*/*.wasm
            _build/retained-boundaries/*/*.wasm.report.txt
            _build/retained-boundaries/*/*.wasm.graph.json
            _build/retained-boundaries/*/*.wasm.comparison.txt
            _build/retained-boundaries/*/*.stdout.txt
            _build/retained-boundaries/*/experiment*.json
            _build/retained-boundaries/*/experiment.html
          if-no-files-found: error

  size-budget:
    name: Size budget
    runs-on: ubuntu-latest
    env:
      # Keep the default debug build and its artifact path in sync.
      EXAMPLE: _build/wasm/debug/build/examples/examples.wasm
      CLI: _build/native/release/build/cmd/main/main.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-moonbit
      - name: Toolchain version
        run: moon version --all
      - name: The example still builds
        run: moon build --target wasm
      - name: Inspect the built example
        run: |
          if [[ ! -s "$EXAMPLE" ]]; then
            echo "missing or empty built example: $EXAMPLE" >&2
            exit 1
          fi
          printf 'budget input: %s\nbytes: %s\n' "$EXAMPLE" "$(wc -c < "$EXAMPLE")"
          sha256sum "$EXAMPLE"
      - name: Build native CLI
        run: moon build --target native --release
      - name: The example stays inside its budget
        run: '"$CLI" "$EXAMPLE" --max-size 100KB'
      - name: Multi-metric budget for the freshly built example
        run: |
          "$CLI" "$EXAMPLE" --budget examples/ci-budget.json \
            --budget-json _build/ci-budget-result.json \
            --budget-md _build/ci-budget-summary.md
          cat _build/ci-budget-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save actual example budget evidence
        uses: actions/upload-artifact@v4
        with:
          name: size-budget-evidence
          path: |
            _build/ci-budget-result.json
            _build/ci-budget-summary.md
          if-no-files-found: error
      # Every valid module exceeds 0B. Only a budget refusal (3), accompanied
      # by its reason, proves that the gate fired; input/launch errors do not.
      - name: The gate actually fires
        run: |
          status=0
          "$CLI" "$EXAMPLE" --max-size 0B > gate.log 2>&1 || status=$?
          cat gate.log
          if [[ "$status" -ne 3 ]]; then
            echo "expected budget exit code 3, got $status" >&2
            exit 1
          fi
          grep -Fq "over the budget" gate.log
