name: Size check

# Report what a pull request does to the size of the example, by building the
# same source on both sides of the merge and comparing the two binaries.
#
# The example is a package of this module (`examples/moon.pkg`), so both sides
# build it the same way and the comparison is between two builds of the same
# source rather than between two stored binaries.

on:
  pull_request:
    branches: [main]

env:
  # Where `moon build --target wasm` leaves the example. Add `--release` to both
  # build steps below and this becomes `_build/wasm/release/...` if a release
  # budget is what matters.
  EXAMPLE: _build/wasm/debug/build/examples/examples.wasm

jobs:
  compare:
    name: Compare the example against the base branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch has to be present to build the baseline from.
          fetch-depth: 0
      - uses: moonbit-community/setup-moonbit@v1

      - name: Build the base branch's example
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/examples/moon.pkg" ]; then
            (cd "$RUNNER_TEMP/base" && moon build --target wasm)
            cp "$RUNNER_TEMP/base/$EXAMPLE" "$RUNNER_TEMP/baseline.wasm"
          else
            # A base branch from before the example was a package has no way to
            # build it, so the checked-in binary is all there is. It carries the
            # throwaway project's package path rather than this module's, which
            # shows up as roughly 30 bytes in the name section — noise against a
            # budget of kilobytes, and gone once this lands on the base branch.
            git show "origin/${{ github.base_ref }}:examples/fib.wasm" \
              > "$RUNNER_TEMP/baseline.wasm"
          fi

      - name: Build this pull request's example
        run: |
          moon build --target wasm
          cp "$EXAMPLE" "$RUNNER_TEMP/current.wasm"

      - name: Compare
        # The tool doing the comparing is this pull request's, so a change that
        # breaks the size gate fails here too.
        #
        # `--max-size` is the growth a pull request may get away with. Raise it
        # deliberately, or drop it to report the change without failing the job.
        run: |
          moon run cmd/main -- "$RUNNER_TEMP/current.wasm" \
            --baseline "$RUNNER_TEMP/baseline.wasm" \
            --top 0 \
            --max-size 5KB
