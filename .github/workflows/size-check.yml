name: Size check

# Report what a pull request does to the size of the example, by building each
# ref's example source and comparing the two binaries.
#
# When both refs have examples/moon.pkg, both use the installed toolchain and
# the same default debug Wasm build. Historical refs without that package use
# their checked-in binary, explicitly reported as a fallback rather than a build.

on:
  pull_request:
    branches: [main]

env:
  # Where `moon build --target wasm` leaves the example. Add `--release` to both
  # build steps below and this becomes `_build/wasm/release/...` if a release
  # budget is what matters.
  EXAMPLE: _build/wasm/debug/build/examples/examples.wasm
  CLI: _build/native/release/build/cmd/main/main.exe

jobs:
  compare:
    name: Compare the example against the base branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch has to be present to build the baseline from.
          fetch-depth: 0
      - uses: ./.github/actions/setup-moonbit
      - name: Toolchain version
        run: moon version --all

      - name: Build the base branch's example
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/examples/moon.pkg" ]; then
            (cd "$RUNNER_TEMP/base" && moon build --target wasm)
            source="$RUNNER_TEMP/base/$EXAMPLE"
            if [[ ! -s "$source" ]]; then
              echo "missing or empty baseline build artifact: $source" >&2
              exit 1
            fi
            printf 'baseline built from source: %s\n' "$source"
            cp "$source" "$RUNNER_TEMP/baseline.wasm"
          else
            echo "baseline uses the repository's historical example; not rebuilt from this branch's source"
            git show "origin/${{ github.base_ref }}:examples/fib.wasm" \
              > "$RUNNER_TEMP/baseline.wasm"
          fi
          if [[ ! -s "$RUNNER_TEMP/baseline.wasm" ]]; then
            echo "missing or empty baseline comparison input" >&2
            exit 1
          fi
          printf 'baseline comparison input: %s\nbytes: %s\n' "$RUNNER_TEMP/baseline.wasm" "$(wc -c < "$RUNNER_TEMP/baseline.wasm")"
          sha256sum "$RUNNER_TEMP/baseline.wasm"

      - name: Build this pull request's example
        run: |
          moon build --target wasm
          if [[ ! -s "$EXAMPLE" ]]; then
            echo "missing or empty current build artifact: $EXAMPLE" >&2
            exit 1
          fi
          printf 'current built from source: %s\n' "$EXAMPLE"
          cp "$EXAMPLE" "$RUNNER_TEMP/current.wasm"
          printf 'current comparison input: %s\nbytes: %s\n' "$RUNNER_TEMP/current.wasm" "$(wc -c < "$RUNNER_TEMP/current.wasm")"
          sha256sum "$RUNNER_TEMP/current.wasm"

      - name: Build native CLI
        run: moon build --target native --release

      - name: Compare
        # The tool doing the comparing is this pull request's, so a change that
        # breaks the size gate fails here too.
        #
        # `--max-size` is the growth a pull request may get away with. Raise it
        # deliberately, or drop it to report the change without failing the job.
        run: |
          "$CLI" "$RUNNER_TEMP/current.wasm" \
            --baseline "$RUNNER_TEMP/baseline.wasm" \
            --top 0 \
            --max-size 5KB
